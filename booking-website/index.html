<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Post Article Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #A52A2A;
            color: white;
            padding: 10px;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 40px;
            width: auto;
            vertical-align: middle;
        }
        .header h1 {
            display: inline;
            margin: 0 10px;
            font-size: 24px;
        }
        .subtitle {
            font-size: 14px;
            display: block;
        }
        .nav-bar {
            background-color: #FFD700;
            padding: 5px;
            text-align: left;
        }
        .nav-bar a {
            color: #A52A2A;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        .main-content {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border: 1px solid #A52A2A;
        }
        h2 {
            color: #A52A2A;
            text-align: center;
            font-size: 20px;
        }
        .section {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        .section h3 {
            color: #A52A2A;
            border-bottom: 1px solid #A52A2A;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 5px;
            vertical-align: top;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .footer {
            background: #A52A2A;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
        .buttons {
            text-align: center;
            margin-top: 15px;
        }
        .buttons button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #submit-btn {
            background-color: #28a745;
            color: white;
        }
        #reset-btn {
            background-color: #dc3545;
            color: white;
        }
        /* Success message styles */
        #success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }
        #success-message .tick {
            font-size: 60px;
            color: green;
        }
        #new-booking-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #new-booking-btn:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            .main-content {
                padding: 10px;
            }
            td {
                display: block;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="image.png" alt="India Post Logo">
        </div>
        <h1>INDIAN POST</h1>
        <span class="subtitle">Post Booking Services</span>
    </div>
    <div class="nav-bar"></div>
    <div class="main-content">
        <h2>Speed Post Article Booking</h2>
        <form id="booking-form">
            <div class="section">
                <h3>Article Details</h3>
                <table>
                    <tr>
                        <td>
                            <label for="article-number">Article Number</label>
                            <input type="text" id="article-number">
                        </td>
                        <td>
                            <label for="weight">Weight (grams)</label>
                            <input type="number" id="weight" min="1">
                        </td>
                    </tr>
                </table>
            </div>

            <div class="section">
                <h3>From Address (Sender)</h3>
                <table>
                    <tr>
                        <td>
                            <label for="sender-first">First Name</label>
                            <input type="text" id="sender-first" required>
                        </td>
                        <td>
                            <label for="sender-last">Last Name</label>
                            <input type="text" id="sender-last" required>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <label for="sender-addr1">Address</label>
                            <input type="text" id="sender-addr1" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="sender-city">City</label>
                            <input type="text" id="sender-city" required>
                        </td>
                        <td>
                            <label for="sender-state">State</label>
                            <input type="text" id="sender-state" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="sender-pin">PIN Code</label>
                            <input type="number" id="sender-pin" min="100000" max="999999" required>
                        </td>
                        <td>
                            <label for="sender-mobile">Mobile Number</label>
                            <input type="number" id="sender-mobile" min="1000000000" max="9999999999" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="sender-email">Email</label>
                            <input type="text" id="sender-email">
                        </td>
                        <td>
                            <label for="sender-dac">Digital Address Code (optional)</label>
                            <input type="text" id="sender-dac">
                        </td>
                    </tr>
                </table>
            </div>

            <div class="section">
                <h3>To Address (Addressee)</h3>
                <table>
                    <tr>
                        <td>
                            <label for="recipient-first">First Name</label>
                            <input type="text" id="recipient-first" required>
                        </td>
                        <td>
                            <label for="recipient-last">Last Name</label>
                            <input type="text" id="recipient-last" required>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <label for="recipient-addr1">Address</label>
                            <input type="text" id="recipient-addr1" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="recipient-city">City</label>
                            <input type="text" id="recipient-city" required>
                        </td>
                        <td>
                            <label for="recipient-state">State</label>
                            <input type="text" id="recipient-state" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="recipient-pin">PIN Code</label>
                            <input type="number" id="recipient-pin" min="100000" max="999999" required>
                        </td>
                        <td>
                            <label for="recipient-mobile">Mobile Number</label>
                            <input type="number" id="recipient-mobile" min="1000000000" max="9999999999" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="recipient-email">Email</label>
                            <input type="text" id="recipient-email">
                        </td>
                        <td>
                            <label for="recipient-dac">Digital Address Code (optional)</label>
                            <input type="text" id="recipient-dac">
                        </td>
                    </tr>
                </table>
            </div>

            <div class="buttons">
                <button type="submit" id="submit-btn">Submit Booking</button>
                <button type="reset" id="reset-btn">Reset</button>
            </div>
        </form>

        <!-- Success message -->
        <div id="success-message">
            <div class="tick">✔</div>
            <h3 style="color: green;">Booking submitted successfully!</h3>
            <button id="new-booking-btn">New Booking</button>
        </div>
    </div>
    <div class="footer">
        Department of Posts, Government of India
    </div>

    <script>
        // PIN code auto-fetch simulation
        function autoFetchCityState(pinInput, cityInput, stateInput) {
            pinInput.addEventListener('blur', function() {
                const pin = this.value;
                if (pin.length === 6) {
                    let state = 'Unknown';
                    let city = 'Unknown';
                    if (pin.startsWith('11')) {
                        state = 'Delhi';
                        city = 'New Delhi';
                    } else if (pin.startsWith('40')) {
                        state = 'Tamil Nadu';
                        city = 'Chennai';
                    } else if (pin.startsWith('38')) {
                        state = 'Uttar Pradesh';
                        city = 'Noida';
                    }
                    cityInput.value = city;
                    stateInput.value = state;
                }
            });
        }

        autoFetchCityState(
            document.getElementById('sender-pin'),
            document.getElementById('sender-city'),
            document.getElementById('sender-state')
        );
        autoFetchCityState(
            document.getElementById('recipient-pin'),
            document.getElementById('recipient-city'),
            document.getElementById('recipient-state')
        );

        // Form validation and submit
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const requiredFields = this.querySelectorAll('[required]');
            let valid = true;
            requiredFields.forEach(field => {
                if (!field.value.trim()) valid = false;
            });
            if (!valid) {
                alert('Please fill all required fields.');
                return;
            }

            // Hide form, show success message
            this.style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
        });

        // Handle "New Booking" button
        document.getElementById('new-booking-btn').addEventListener('click', function() {
            const form = document.getElementById('booking-form');
            form.reset();
            form.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        });
    </script>
</body>
</html>
